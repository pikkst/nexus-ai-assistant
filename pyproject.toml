[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus — Privacy-first local AI assistant with camera, microphone, and speakers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nexus Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "opencv-python>=4.9.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "gradio>=4.44.0",
    "customtkinter>=5.2.0",
    "loguru>=0.7.0",
    "aiofiles>=23.2.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0.0"]
tts = ["piper-tts>=1.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.urls]
Homepage = "https://github.com/nexus/nexus"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
