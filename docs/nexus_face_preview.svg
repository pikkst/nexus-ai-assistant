<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6ec6ff"/>
      <stop offset="60%" stop-color="#2a8bcc"/>
      <stop offset="100%" stop-color="#1a5a8a"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <circle cx="200" cy="250" r="180" fill="#1a1a2e" rx="40" ry="40"/>

  <!-- Head shape - soft rounded rectangle -->
  <rect x="60" y="60" width="280" height="340" rx="60" ry="60" fill="#2d2d44" stroke="#3d3d55" stroke-width="3" filter="url(#shadow)"/>

  <!-- Forehead highlight -->
  <ellipse cx="200" cy="110" rx="80" ry="25" fill="#3d3d55" opacity="0.5"/>

  <!-- Eyes -->
  <!-- Left eye white -->
  <ellipse cx="155" cy="210" rx="50" ry="55" fill="#f0f0f5" stroke="#dddde8" stroke-width="2"/>
  <!-- Left eye glow -->
  <ellipse cx="155" cy="210" rx="50" ry="55" fill="url(#eyeGlow)"/>
  <!-- Left iris -->
  <ellipse cx="155" cy="210" rx="28" ry="32" fill="url(#irisGrad)"/>
  <!-- Left pupil -->
  <ellipse cx="155" cy="210" rx="14" ry="16" fill="url(#pupilGrad)"/>
  <!-- Left highlight -->
  <ellipse cx="143" cy="198" rx="10" ry="12" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="165" cy="225" rx="4" ry="5" fill="#ffffff" opacity="0.3"/>

  <!-- Right eye white -->
  <ellipse cx="245" cy="210" rx="50" ry="55" fill="#f0f0f5" stroke="#dddde8" stroke-width="2"/>
  <!-- Right eye glow -->
  <ellipse cx="245" cy="210" rx="50" ry="55" fill="url(#eyeGlow)"/>
  <!-- Right iris -->
  <ellipse cx="245" cy="210" rx="28" ry="32" fill="url(#irisGrad)"/>
  <!-- Right pupil -->
  <ellipse cx="245" cy="210" rx="14" ry="16" fill="url(#pupilGrad)"/>
  <!-- Right highlight -->
  <ellipse cx="233" cy="198" rx="10" ry="12" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="255" cy="225" rx="4" ry="5" fill="#ffffff" opacity="0.3"/>

  <!-- Eyebrows - neutral -->
  <path d="M105 155 Q130 140 160 150" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M295 155 Q270 140 240 150" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Nose - subtle -->
  <path d="M200 280 Q195 290 200 295 Q205 290 200 280" fill="#3d3d55" stroke="#4a4a62" stroke-width="1"/>

  <!-- Mouth - gentle smile -->
  <path d="M168 320 Q200 340 232 320" stroke="#4a4a62" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Blush circles -->
  <ellipse cx="120" cy="270" rx="20" ry="12" fill="#ff6b8a" opacity="0.15"/>
  <ellipse cx="280" cy="270" rx="20" ry="12" fill="#ff6b8a" opacity="0.15"/>

  <!-- Emotion label -->
  <text x="200" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#888899" font-weight="bold">NEXUS</text>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666677">idle</text>
</svg>